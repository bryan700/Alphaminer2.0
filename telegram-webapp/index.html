<!DOCTYPE html>
<html>
<head>
  <title>Mining Dashboard</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
      margin-top: 50px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
    }
  </style>
</head>

<body>

  <h1>⛏ Cloud Mining Dashboard</h1>

  <p id="user">Loading user...</p>

  <button onclick="mine()">Start Mining</button>

  <script>
    window.addEventListener("DOMContentLoaded", () => {

      const tg = window.Telegram?.WebApp;

      if (!tg) {
        document.getElementById("user").innerText =
          "Open inside Telegram";
        return;
      }

      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe?.user;

      if (user) {

        console.log("Telegram User ID:", user.id);
        console.log("First name:", user.first_name);

        document.getElementById("user").innerText =
          "Welcome " + user.first_name + " (ID: " + user.id + ")";

      } else {

        document.getElementById("user").innerText =
          "User not detected";

      }

      let balance = 0;
let mining = false;

window.startMining = function () {

  if (mining) return;

  mining = true;

  setInterval(() => {

    balance += 0.001;

    document.getElementById("balance").innerText =
      balance.toFixed(4);

  }, 1000);

};

    });
  </script>

</body>
</html>
